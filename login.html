<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onnate 로그인</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Dotum","돋움","Malgun Gothic",sans-serif;font-size:12px;color:#3d4a5c;
background:radial-gradient(ellipse at 50% 40%,#fcfdff 0%,#f1f4f8 55%,#e6ebf2 100%);
display:flex;align-items:center;justify-content:center;overflow:hidden}

/* 로그인 창 */
.win{width:300px;background:#eef3fa;border:1px solid #6d86a8;border-radius:6px 6px 0 0;
box-shadow:0 0 0 1px #fff inset,3px 4px 14px rgba(70,90,120,.28)}
.bar{height:26px;border-radius:5px 5px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 8px;
background:linear-gradient(#8fb0dc,#5f87bd 50%,#4f78b2 51%,#6d92c6);color:#fff;font-weight:bold;text-shadow:0 1px 0 #3c5f93}
.bar .btns{display:flex;gap:2px}
.bar .btns i{width:18px;height:16px;border:1px solid #3c5f93;border-radius:3px;background:linear-gradient(#c6d9f1,#8aaad6);display:block;position:relative}
.bar .btns i.x{background:linear-gradient(#f0b3a6,#d0624c)}
.bar .btns i::after{content:"";position:absolute;left:4px;bottom:3px;width:8px;height:2px;background:#fff}
.bar .btns i.x::after{content:"×";bottom:-2px;left:4px;width:auto;height:auto;background:none;font-size:13px;line-height:15px}

.body{padding:22px 26px 16px}
.logo{text-align:center;margin-bottom:4px;font-family:"Montserrat","Segoe UI","Malgun Gothic",sans-serif;font-size:27px;font-weight:600;color:#4b5a6d;letter-spacing:-.5px}
.logo sup{font-size:.55em}
.sub{text-align:center;font-size:9px;letter-spacing:3px;color:#8a97a8;margin-bottom:20px}

.field{display:flex;align-items:center;margin-bottom:6px}
.field label{width:54px;color:#4a5d78;font-weight:bold}
.field input{flex:1;height:22px;border:1px solid #8ea5c4;border-top-color:#6d86a8;background:#fff;padding:0 6px;font-size:12px;color:#2c3a4e;font-family:inherit;outline:none}
.field input:disabled{background:#fff;color:#2c3a4e}
.field input.on{box-shadow:0 0 0 1px #8fb0dc}

.opts{margin:10px 0 14px 54px;display:flex;flex-direction:column;gap:5px;color:#5c6b80}
.opts span{display:flex;align-items:center;gap:5px}
.chk{width:12px;height:12px;border:1px solid #8ea5c4;background:#fff;display:inline-block;position:relative}
.chk.c::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #3f6aa8;border-width:0 2px 2px 0;transform:rotate(40deg)}

.row{display:flex;justify-content:center;gap:6px}
.btn{width:78px;height:26px;border:1px solid #4f78b2;border-radius:3px;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;
background:linear-gradient(#f9fbff,#dce7f6 50%,#c9daf0 51%,#dfe9f7);color:#35527f}
.btn:hover:not(:disabled){background:linear-gradient(#ffffff,#e8f0fb 50%,#d5e4f7 51%,#e8f0fb)}
.btn:active:not(:disabled){background:#c3d5ee}
.btn:disabled{color:#98a8c0;border-color:#a9b9d0;cursor:default}
.btn:focus-visible{outline:2px solid #3f6aa8;outline-offset:1px}
.btn.ready{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(79,120,178,.35)}}

.status{height:16px;margin-top:12px;text-align:center;color:#7b8aa0;font-size:11px}
.prog{height:4px;margin:4px 26px 18px;border-radius:2px;background:#d7e0ec;overflow:hidden;visibility:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(#8aa4c4,#5a7aa0)}
.foot{border-top:1px solid #cdd8e8;background:#e4ecf6;padding:6px 10px;text-align:center;font-size:10px;color:#8a97a8}

@media(prefers-reduced-motion:reduce){.btn.ready{animation:none}}
#gate{display:none;position:fixed;inset:0;z-index:9;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(ellipse at 50% 40%,#fcfdff 0%,#f1f4f8 55%,#e6ebf2 100%)}
#gate b{font-family:"Montserrat","Segoe UI",sans-serif;font-size:27px;font-weight:600;color:#4b5a6d;margin-bottom:10px}
#gate span{font-size:11px;color:#8a97a8}
.mark{display:block;width:56px;height:auto;margin:0 auto 0}
.mark.big{width:64px;margin-bottom:0}
.logo{line-height:1.05}
.logo span{display:block;margin-top:-2px}
#gate b{line-height:1.05;margin-top:-2px}
</style>
</head>

    <div class="sub">chanhee yui</div>

    <div class="field"><label for="uid">아이디</label><input id="uid" type="text" autocomplete="off" disabled></div>
    <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="off" disabled></div>

    <div class="opts">
      <span><i class="chk c"></i>아이디 저장</span>
      <span><i class="chk"></i>자동 로그인</span>
    </div>

    <div class="row">
      <button class="btn" id="ok" disabled>확인</button>
      <button class="btn" id="cancel" disabled>취소</button>
    </div>
    <div class="status" id="st">접속 준비 중…</div>
  </div>
  <div class="prog" id="prog"><b id="bar"></b></div>
  <div class="foot">ⓒ onnate</div>
</div>

<script>
(function(){
  var uid=document.getElementById('uid'), pw=document.getElementById('pw'),
      ok=document.getElementById('ok'), st=document.getElementById('st'),
      prog=document.getElementById('prog'), bar=document.getElementById('bar'),
      win=document.getElementById('win');


  /* 소리 (파일 없이 브라우저에서 직접 만들어 냄) */
  var AC=window.AudioContext||window.webkitAudioContext, ctx=null;
  function getCtx(){ if(!ctx&&AC){ctx=new AC();} if(ctx&&ctx.state==='suspended'){ctx.resume();} return ctx; }
  function noise(vol,dur,type,freq,q){
    var c=getCtx(); if(!c) return;
    var n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4); }
    var src=c.createBufferSource(); src.buffer=buf;
    var f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q||0.7;
    var g=c.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  }
  function tone(vol,dur,freq){
    var c=getCtx(); if(!c) return;
    var o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
    o.type='square'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur);
  }
  /* 키보드: 단단한 돌끼리 부딪히는 듯 짧고 건조한 "또각" 소리 (키보드 누름 + 뗌) */
  function stoneHit(vol,f1,f2,dur){
    noise(vol,dur,'bandpass',f1,5);
    noise(vol*0.7,dur*0.8,'bandpass',f2,6);
    noise(vol*0.5,dur*1.6,'lowpass',700,0.8);
  }
  function keySound(){
    var r=Math.random();
    stoneHit(0.55,1500+r*400,2800+r*500,0.022);
    setTimeout(function(){ stoneHit(0.22,2000+r*300,3400,0.014); },55+Math.random()*25);
  }
  /* 마우스: 누를 때 "딸깍" 날카로운 소리, 뗄 때 작은 "딸" */
  function mouseDown(){ noise(0.35,0.012,'highpass',3500,0.7); tone(0.07,0.018,2100); }
  function mouseUp(){ noise(0.18,0.010,'highpass',4200,0.7); tone(0.035,0.014,1500); }
  document.addEventListener('mousedown',function(){ getCtx(); mouseDown(); });
  document.addEventListener('mouseup',function(){ mouseUp(); });

  function type(el,text,done){
    var i=0; el.classList.add('on');
    (function step(){
      el.value=text.slice(0,++i); keySound();
      if(i<text.length) setTimeout(step,110+Math.random()*90);
      else { el.classList.remove('on'); setTimeout(done,350); }
    })();
  }

  function begin(){ setTimeout(function(){
    st.textContent='아이디를 입력하는 중…';
    type(uid,MY_ID,function(){
      st.textContent='비밀번호를 입력하는 중…';
      type(pw,MY_PASS,function(){
        st.textContent='확인 버튼을 눌러 주세요.';
        ok.disabled=false; ok.classList.add('ready'); ok.focus();
      });
    });
  },700); }

  var gate=document.getElementById('gate'), c0=getCtx();
  if(c0&&c0.state==='running'){ begin(); }
  else { gate.style.display='flex'; gate.addEventListener('click',function(){ getCtx(); gate.style.display='none'; begin(); },{once:true}); }

  ok.addEventListener('click',function(){
    ok.disabled=true; ok.classList.remove('ready');
    prog.style.visibility='visible';
    var msgs=['onnate 시작 중⋯','보안 연결 확인⋯','데이터 불러오는 중⋯','onnate 로그인 완료'];
    var p=0,m=0;
    var t=setInterval(function(){
      p+=2; bar.style.width=p+'%';
      var idx=Math.min(3,Math.floor(p/26));
      if(idx!==m||p===2){m=idx;st.textContent=msgs[idx];}
      if(p>=100){
        clearInterval(t);
        setTimeout(function(){
          if(NEXT_URL){location.href=NEXT_URL;}
        },500);
      }
    },45);
  });
})();
</script>
