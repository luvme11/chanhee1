<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAIR PROMPT MAKER</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#dfe9f5;--cd:#f4f8fd;--ln:#9db6d6;--tx:#2b3a4d;--sb:#6c7f97;--a:#2f6fc4;--in:#fff;--hd:#eaf2fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b26;--cd:#1d2635;--ln:#3a4f6d;--tx:#dbe5f2;--sb:#8fa3bd;--a:#7db3f5;--in:#141b26;--hd:#223049}}
:root[data-theme="dark"]{--bg:#141b26;--cd:#1d2635;--ln:#3a4f6d;--tx:#dbe5f2;--sb:#8fa3bd;--a:#7db3f5;--in:#141b26;--hd:#223049}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.t-wrap{max-width:1100px;margin:0 auto;padding:12px}
.t-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#5b9be0,#2f6fc4);color:#fff;border-radius:8px 8px 0 0}
.t-top b{font-size:14px}.t-top span{font-size:11px;opacity:.85;flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
.t-b{padding:4px 10px;background:var(--hd);border:1px solid var(--ln);border-radius:3px;cursor:pointer}
.t-b:hover,.t-b.on{border-color:var(--a);color:var(--a)}
.t-b.on{font-weight:bold}
.t-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:12px;margin-top:12px}
@media(max-width:820px){.t-grid{grid-template-columns:1fr}}
.t-box{background:var(--cd);border:1px solid var(--ln);border-radius:4px;margin-bottom:10px}
.t-box>summary,.t-ttl{padding:8px 12px;font-weight:bold;color:var(--a);cursor:pointer;list-style:none;border-bottom:1px solid var(--ln);background:var(--hd)}
.t-ttl{cursor:default;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.t-ttl .sp{flex:1}
.t-in{padding:10px 12px;display:grid;gap:8px}
.t-f{display:grid;gap:3px}.t-f>span{font-size:11px;color:var(--sb)}
.t-f input:not([type=range]):not([type=color]),.t-f select,textarea{width:100%;padding:6px 8px;background:var(--in);border:1px solid var(--ln);border-radius:3px}
.t-f input[type=color]{width:100%;height:28px;padding:0;border:1px solid var(--ln);background:none}
textarea{resize:vertical;line-height:1.6}
.t-c{display:flex;gap:6px;align-items:center}
.t-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t-tb{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.t-pr{display:flex;gap:6px;flex-wrap:wrap}
.t-pr button{display:flex;align-items:center;gap:5px}.t-pr i{width:10px;height:10px;border-radius:50%;display:inline-block}
.t-help{font-size:11px;color:var(--sb);line-height:1.7}
.t-sub{font-weight:bold;color:var(--a);padding-top:4px;border-top:1px dashed var(--ln)}
.t-im{display:flex;align-items:center;gap:6px;margin-top:4px}.t-im img{width:36px;height:36px;object-fit:cover;border:1px solid var(--ln);border-radius:3px}.t-im b{flex:1}.t-im em{font-size:11px;color:var(--sb);font-style:normal}
#tpvw{padding:18px 14px;margin:0 auto;overflow-x:auto;transition:max-width .2s}
#tout{width:100%;height:220px;font:11px/1.5 monospace;white-space:pre}
.t-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--a);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.t-toast.on{opacity:1}
</style>
</head>
<body>
<div class="t-wrap">
  <div class="t-top"><b>PAIR PROMPT MAKER</b><span>이미지 + 인물별 복사 버튼 · 배경 투명</span><button class="t-b" id="ttheme" type="button">화면 밝기</button></div>
  <div class="t-grid">
    <div id="tctl"></div>
    <div>
      <div class="t-box">
        <div class="t-ttl">미리보기<span class="sp"></span>
          <button class="t-b" type="button" data-w="100%">PC</button>
          <button class="t-b" type="button" data-w="360px">모바일</button>
          <select id="tpvbg" class="t-b"><option value="#ffffff">흰 배경</option><option value="#f1f3f5">회색 배경</option><option value="#f6efe0">베이지 배경</option><option value="#1a1a1a">어두운 배경</option></select>
        </div>
        <div id="tpvbox"><div id="tpvw"><div id="tpv"></div></div></div>
      </div>
      <div class="t-box">
        <div class="t-ttl">게시판에 붙여넣을 코드 <span id="tsize" class="t-help"></span><span class="sp"></span>
          <button class="t-b" type="button" id="tcopy">전체 코드 복사</button>
          <button class="t-b" type="button" id="tcopy1">이 페어만 복사</button>
          <button class="t-b" type="button" id="treset">초기화</button>
        </div>
        <div class="t-in"><textarea id="tout" readonly></textarea>
        <div class="t-help">글 편집창을 HTML 모드로 바꾼 뒤 통째로 붙여넣으세요. 페어마다 글을 따로 올리고 싶으면 <b>이 페어만 복사</b>를 쓰세요. 말풍선 아래 복사 버튼은 글을 보는 사람이 프롬프트를 복사하는 버튼이에요. 게시판이 버튼 동작(onclick)을 막으면 눌러도 복사가 안 될 수 있어요. 설정과 올린 사진은 이 브라우저에 자동 저장돼요 (저장이 막힌 환경이면 작업 후 바로 복사해 두세요).</div></div>
      </div>
    </div>
  </div>
</div>
<div class="t-toast" id="ttoast"></div>
<script>
const $=q=>document.querySelector(q);
const LINK='<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">';
const FONTS={pre:'"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',noto:'"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',sys:'"Malgun Gothic","Apple SD Gothic Neo",sans-serif',ser:'"Nanum Myeongjo","Noto Serif KR","Batang",serif'};
/* ac=A 라벨·복사 버튼색, a2=B 라벨색, bb=말풍선 배경, tx=글자색, ln=테두리, ot=작은 글자색 */
const PRE={
nate:{ac:'#2f6fc4',a2:'#d9568a',bb:'#ffffff',tx:'#2b3a4d',ot:'#6c7f97',ln:'#9db6d6'},
pink:{ac:'#d9568a',a2:'#7a5fc7',bb:'#ffffff',tx:'#4a2b38',ot:'#a07084',ln:'#f0b5cb'},
mint:{ac:'#2a9d8f',a2:'#e08a3c',bb:'#ffffff',tx:'#23423e',ot:'#6b928d',ln:'#a6d9d0'},
lav:{ac:'#7a5fc7',a2:'#d9568a',bb:'#ffffff',tx:'#352b52',ot:'#8a7fa8',ln:'#cfc2f0'},
dark:{ac:'#3a6aa8',a2:'#c0577f',bb:'#2a3040',tx:'#e6ecf5',ot:'#9aa6bd',ln:'#3a4256'},
paper:{ac:'#8b5e34',a2:'#4f7a5a',bb:'#ffffff',tx:'#3d3022',ot:'#8f7d63',ln:'#d0bd96'},
mono:{ac:'#333333',a2:'#888888',bb:'#ffffff',tx:'#222222',ot:'#888888',ln:'#cccccc'}};
const PN={nate:'네이트온',pink:'핑크',mint:'민트',lav:'라벤더',dark:'다크',paper:'종이',mono:'미니멀'};
const blank=()=>({title:'새 페어',sub:'',imgs:[],ai:'',bi:'',an:'',ap:'',ax:'',bn:'',bp:'',bx:'',cp:'',cx:''});
const D=Object.assign({id:'pair',lay:'card',ca:'OC',cb:'PAIR',bubble:'round',hs:'tab',chip:'PAIR',showNo:true,start:1,pad:'2',btn:'fill',btnT:'복사',al:'right',width:460,fs:13,font:'pre',link:false,pvbg:'#ffffff',imgw:'800',cur:0,kp:'외형',kx:'네거티브',kq:'프롬프트',kc:'커플',
topics:[{title:'예시 페어',sub:'',imgs:[],ai:'',bi:'',an:'',ap:'1girl, long black hair, red eyes, school uniform',ax:'bad hands, blurry, lowres',bn:'',bp:'1boy, short silver hair, blue eyes, black jacket',bx:'bad hands, blurry, lowres',cp:'2people, hug, looking at each other, cafe, warm light',cx:'character blending, same face, extra person'}]},PRE.nate);
let s=JSON.parse(JSON.stringify(D)),IM={},warned=false;
try{Object.assign(s,JSON.parse(localStorage.getItem('pairmk1')||'{}'))}catch(e){}
try{IM=JSON.parse(localStorage.getItem('pairmkim')||'{}')}catch(e){}
if(!Array.isArray(s.topics)||!s.topics.length)s.topics=JSON.parse(JSON.stringify(D.topics));
s.topics=s.topics.map(t=>Object.assign(blank(),t));
if(!(s.cur>=0&&s.cur<s.topics.length))s.cur=0;

const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* 게시판에 올라가는 복사 버튼 동작 (바로 위 말풍선 글자를 클립보드로) */
const OC=`var e=this,t=e.parentNode.previousElementSibling.innerText,o=e.innerHTML,d=function(){e.textContent='복사됨!';setTimeout(function(){e.innerHTML=o},1500)},f=function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}document.body.removeChild(a);d()};if(navigator.clipboard){navigator.clipboard.writeText(t).then(d,f)}else{f()}`;

function sect(chip,cls,name,items){
 const it=items.filter(x=>String(x[1]||'').trim());if(!it.length)return'';
 return '<div class="o-g"><div class="o-l"><span class="o-p'+cls+'">'+esc(chip)+'</span>'+(name?'<span class="o-n">'+esc(name)+'</span>':'')+'</div>'
 +it.map(x=>'<div class="o-k">'+esc(x[0])+'</div><div class="c-b'+(x[2]?' n':'')+'">'+esc(String(x[1]).trim()).replace(/\n/g,'<br>')+'</div><div class="c-x"><button type="button" onclick="'+OC+'">'+esc(s.btnT||'복사')+'</button></div>').join('')+'</div>'}

function cbtn(l,txt){return '<button type="button" onclick="'+esc(OC.replace('e.parentNode.previousElementSibling.innerText',()=>JSON.stringify(txt))).replace(/"/g,'&quot;')+'"><i class="o-i"></i>'+esc(l)+'</button>'}
function cper(chip,cls,nm,img,p,x){
 const b=[[s.kp,p],[s.kx,x]].filter(a=>String(a[1]||'').trim()),n=String(nm||'').trim();
 if(!IM[img]&&!b.length&&!n)return'';
 return '<div class="k-c">'+(IM[img]?'<img class="k-im" src="'+IM[img]+'" alt="">':'')
  +((chip||n)?'<div class="k-nm">'+(chip?'<span class="o-p'+cls+'">'+esc(chip)+'</span>':'')+(n?'<span class="o-n">'+esc(n)+'</span>':'')+'</div>':'')
  +(b.length?'<div class="k-bt">'+b.map(a=>cbtn(a[0],String(a[1]).trim())).join('')+'</div>':'')+'</div>'}
function cardHtml(t){
 const a=cper(s.ca,'',t.an,t.ai,t.ap,t.ax),b=cper(s.cb,' b',t.bn,t.bi,t.bp,t.bx),k=s.kc||'커플',
  c=[[k+' '+s.kq,t.cp],[k+' '+s.kx,t.cx]].filter(x=>String(x[1]||'').trim());
 if(!a&&!b&&!c.length)return'';
 return '<div class="k-box">'+(a||b?'<div class="k-row">'+a+b+'</div>':'')+(c.length?'<div class="k-bt k-cp">'+c.map(x=>cbtn(x[0],String(x[1]).trim())).join('')+'</div>':'')+'</div>'}

function topicHtml(t,i){
 const lab=(s.chip||'')+(s.chip&&s.showNo?' ':'')+(s.showNo?String(i+(isNaN(parseInt(s.start))?1:parseInt(s.start))).padStart(+s.pad||2,'0'):'');
 const head=(lab?'<span class="o-c">'+esc(lab)+'</span>':'')+'<span class="o-tt">'+esc(t.title||'')+'</span>';
 const sub=t.sub?'<div class="o-s">'+esc(t.sub)+'</div>':'';
 if(s.lay=='card')return '<div class="o-t"><div class="o-h">'+head+'</div>'+sub+cardHtml(t)+'</div>';
 const im=t.imgs.map(n=>IM[n]?'<img class="c-img" src="'+IM[n]+'" alt="">':'').join('');
 return '<div class="o-t"><div class="o-h">'+head+'</div>'+sub+im
  +sect('A','',t.an,[[s.kp,t.ap],[s.kx,t.ax,1]])+sect('B',' b',t.bn,[[s.kp,t.bp],[s.kx,t.bx,1]])+sect(s.kc||'커플',' c','',[[s.kq,t.cp],[s.kx,t.cx,1]])+'</div>'}

function gen(only){
 const P=(s.id||'').replace(/[^\w-]/g,'')||'pair',br=({round:16,pill:26,square:4})[s.bubble]||16;
 const HS={
  tab:'\n§ .o-h::after{content:"";flex:1;border-top:1px solid var(--ln)}',
  under:'\n§ .o-h{padding-bottom:6px;border-bottom:2px solid var(--ac)}',
  box:'\n§ .o-h{padding:8px 12px;border:1px solid var(--ln);border-radius:6px}',
  center:'\n§ .o-h{justify-content:center}\n§ .o-h::before,§ .o-h::after{content:"";flex:1;border-top:1px solid var(--ln)}',
  plain:''}[s.hs]||'';
 const BT={fill:'background:var(--ac);color:#fff;border:1px solid var(--ac)',line:'background:transparent;color:var(--ac);border:1px solid var(--ac)',text:'background:transparent;color:var(--ac);border:0;text-decoration:underline'}[s.btn]||'',
  BC={fill:'background:var(--ac);color:#fff;border:1px solid var(--ac)',line:'background:transparent;color:var(--tx);border:1px solid var(--ln)',text:'background:transparent;color:var(--ac);border:0;text-decoration:underline'}[s.btn]||'';
 const css=`§{--ac:${s.ac};--a2:${s.a2};--ln:${s.ln};--bb:${s.bb};--tx:${s.tx};--ot:${s.ot};all:initial;display:block;box-sizing:border-box;width:100%;max-width:${s.width}px;margin:0 auto;font-family:${FONTS[s.font]};font-size:${s.fs}px;line-height:1.5;color:var(--tx)}
§ *{box-sizing:border-box;font-family:inherit}
§ .o-t{display:block;margin:0 0 30px}
§ .o-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-weight:bold;font-size:1.08em;color:var(--tx)}
§ .o-c{flex:none;padding:2px 9px;border-radius:10px;background:var(--ac);color:#fff;font-size:11px;font-weight:bold}
§ .o-s{font-size:11px;color:var(--ot);margin:0 0 10px}${HS}
§ .k-box{display:block;padding:8px;border:1px solid var(--ln);border-radius:14px}
§ .k-row{display:flex;gap:8px;align-items:stretch}
§ .k-c{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
§ .k-im{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 7px}
§ .k-nm{display:flex;align-items:center;gap:6px;margin:0 0 7px}
§ .k-bt{display:flex;gap:6px;margin-top:auto}
§ .k-cp{margin-top:8px}
§ .k-bt button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;margin:0;padding:6px 4px;border-radius:16px;font-size:11px;font-weight:bold;cursor:pointer;line-height:1.4;${BC}}
§ .o-i{display:inline-block;flex:none;position:relative;width:7px;height:7px;border:1.5px solid currentColor;border-radius:2px;margin:0 4px 3px 0}
§ .o-i::after{content:"";position:absolute;left:2px;top:2px;width:7px;height:7px;border:1.5px solid currentColor;border-radius:2px}
§ .c-img{display:block;width:100%;max-width:100%;height:auto;border-radius:6px;margin:0 0 12px}
§ .o-g{display:block;margin:16px 0 0}
§ .o-l{display:flex;align-items:center;gap:6px}
§ .o-p{flex:none;padding:2px 9px;border-radius:10px;background:var(--ac);color:#fff;font-size:11px;font-weight:bold}
§ .o-p.b{background:var(--a2)}
§ .o-p.c{background:var(--ot)}
§ .o-n{font-weight:bold}
§ .o-k{font-size:11px;color:var(--ot);margin:9px 0 3px}
§ .c-b{display:block;padding:11px 15px;background:var(--bb);color:var(--tx);border:1px solid var(--ln);border-radius:${br}px;line-height:1.75;word-break:break-word}
§ .c-b.n{border-style:dashed}
§ .c-x{display:block;margin-top:7px;text-align:${s.al}}
§ .c-x button{display:inline-block;margin:0;padding:4px 14px;border-radius:14px;font-size:11px;font-weight:bold;cursor:pointer;line-height:1.5;${BT}}`.replace(/§/g,'#'+P);
 let h='<div id="'+P+'">';
 s.topics.forEach((t,i)=>{if(only==null||only===i)h+=topicHtml(t,i)});
 return{css,html:h+'</div>'}}

function build(only){const{css,html}=gen(only);return(s.link?LINK+'\n':'')+'<style>\n'+css+'\n</style>\n\n'+html}
function render(){const{css,html}=gen(),n=build();
 $('#tout').value=n;$('#tpv').innerHTML='<style>'+css+'</style>'+html;$('#tpvbox').style.background=s.pvbg;
 $('#tsize').textContent=n.length+'자'+(n.length>300000?' ⚠ 너무 길어서 게시판이 못 받을 수 있어요. 페어를 나눠 올리거나 이미지 최대 가로를 줄여 보세요':'');
 document.querySelectorAll('[data-v]').forEach(e=>e.textContent=s[e.dataset.v]);drawTabs();drawIm();
 try{localStorage.setItem('pairmk1',JSON.stringify(s))}catch(e){if(!warned){warned=true;toast('이 환경에서는 자동 저장이 안 돼요. 작업 후 바로 코드를 복사해 두세요')}}}

const inp=(k,l)=>'<label class="t-f"><span>'+l+'</span><input data-k="'+k+'"></label>';
const tin=(k,l)=>'<label class="t-f"><span>'+l+'</span><input data-t="'+k+'"></label>';
const tta=(k,l,r)=>'<label class="t-f"><span>'+l+'</span><textarea rows="'+r+'" data-t="'+k+'"></textarea></label>';
const chk=(k,l)=>'<label class="t-c"><input type="checkbox" data-k="'+k+'"> '+l+'</label>';
const col=(k,l)=>'<label class="t-f"><span>'+l+'</span><input type="color" data-k="'+k+'"></label>';
const rng=(k,l,a,b)=>'<label class="t-f"><span>'+l+' <em data-v="'+k+'"></em></span><input type="range" min="'+a+'" max="'+b+'" data-k="'+k+'"></label>';
const sel=(k,l,o)=>'<label class="t-f"><span>'+l+'</span><select data-k="'+k+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></label>';
const sec=(t,c,o)=>'<details class="t-box"'+(o?' open':'')+'><summary>'+t+'</summary><div class="t-in">'+c+'</div></details>';
$('#tctl').innerHTML=
 sec('1. 디자인 고르기','<div class="t-pr">'+Object.keys(PRE).map(k=>'<button class="t-b" type="button" data-p="'+k+'"><i style="background:'+PRE[k].ac+'"></i>'+PN[k]+'</button>').join('')+'</div>'
  +'<div class="t-help">먼저 마음에 드는 색을 누르고, 아래 칸에서 모양이나 색을 바꿔 보세요. 배경은 항상 투명이에요.</div>'
  +sel('lay','보여주는 방식',[['card','카드형 (이미지 2장 + 복사 버튼)'],['bubble','말풍선형 (글이 다 보임)']])
  +'<div class="t-g2">'+sel('bubble','말풍선 모양',[['round','둥근'],['pill','아주 둥근'],['square','각진']])+sel('hs','제목 모양',[['tab','라벨 + 옆줄'],['under','밑줄'],['box','테두리 상자'],['center','가운데 + 양옆 선'],['plain','글자만']])+'</div>'
  +'<div class="t-g2">'+sel('btn','복사 버튼 모양',[['fill','색 채움'],['line','테두리만'],['text','글자만']])+sel('al','복사 버튼 위치',[['left','왼쪽'],['center','가운데'],['right','오른쪽']])+'</div>'
  +'<div class="t-g2">'+col('bb','말풍선 배경')+col('tx','글자색')+col('ln','테두리색')+col('ot','작은 글자색')+col('ac','A · 복사 버튼색')+col('a2','B 라벨색')+'</div>'
  +rng('width','가로 폭(px)',300,700)+rng('fs','글자 크기(px)',11,18)+sel('font','글꼴',[['pre','프리텐다드'],['noto','Noto Sans KR'],['sys','시스템 기본'],['ser','명조']]),1)
 +sec('2. 페어 (여러 개)','<div id="ttabs" class="t-tb"></div>'
  +'<div class="t-tb"><button class="t-b" type="button" data-add="1">+ 페어 추가</button><button class="t-b" type="button" data-mv="-1">↑ 앞으로</button><button class="t-b" type="button" data-mv="1">↓ 뒤로</button><button class="t-b" type="button" data-rmt="1">이 페어 삭제</button></div>'
  +tin('title','제목')+tin('sub','한 줄 설명 (선택)')
  +'<div class="t-sub">이미지 (카드형: A·B 각각 지정 / 말풍선형: 제목 아래)</div><div class="t-tb"><button class="t-b" type="button" id="tup">이미지 올리기</button><input type="file" id="tfile" accept="image/*" multiple hidden><select data-k="imgw"><option value="500">최대 가로 500px</option><option value="800">최대 가로 800px</option><option value="1000">최대 가로 1000px</option></select></div><div id="timgs"></div>'
  +'<div class="t-sub">인물 A</div>'+tin('an','이름 (선택)')+tta('ap','외형 프롬프트',3)+tta('ax','외형 네거티브',3)
  +'<div class="t-sub">인물 B</div>'+tin('bn','이름 (선택)')+tta('bp','외형 프롬프트',3)+tta('bx','외형 네거티브',3)
  +'<div class="t-sub">커플</div>'+tta('cp','커플 프롬프트 (구도 · 분위기 · 배경)',3)+tta('cx','커플 네거티브',3)
  +'<div class="t-help">카드형은 A·B 이미지를 나란히 놓고 그 아래에 복사 버튼이 붙어요 (버튼을 누르면 숨겨둔 프롬프트가 복사돼요). 말풍선형은 제목 → 이미지 → A → B → 커플 순서로 글이 다 보여요. 각 말풍선 아래에 복사 버튼이 붙고, 비워 둔 칸은 글에 나오지 않아요. 이미지는 올린 뒤 이 페어에 쓸 것만 \'쓰기\'로 켜 두세요. 복사 버튼은 말풍선 안의 글자만 복사해요.</div>',1)
 +sec('3. 출력 옵션',inp('id','고유 ID (한 글에 여러 개 넣을 땐 서로 다르게)')+chk('link','프리텐다드 불러오는 줄을 코드 맨 위에 포함')
  +'<div class="t-g2">'+inp('btnT','복사 버튼 글자')+inp('chip','제목 앞 라벨 (비우면 없음)')+inp('kp','인물 프롬프트 이름')+inp('kx','네거티브 이름')+inp('kq','커플 프롬프트 이름')+inp('kc','커플 라벨')+inp('ca','A 라벨 (예: OC)')+inp('cb','B 라벨 (예: PAIR)')+'</div>'
  +chk('showNo','제목에 번호 붙이기')
  +'<div class="t-g2"><label class="t-f"><span>시작 번호 (이어서 올릴 때)</span><input type="number" min="0" data-k="start"></label>'+sel('pad','번호 모양',[['2','01, 02'],['1','1, 2']])+'</div>');

function bindT(){const t=s.topics[s.cur];document.querySelectorAll('[data-t]').forEach(e=>{const v=t[e.dataset.t];e.value=v==null?'':v})}
function drawTabs(){$('#ttabs').innerHTML=s.topics.map((t,i)=>'<button class="t-b'+(i==s.cur?' on':'')+'" type="button" data-tp="'+i+'">'+(i+1)+'. '+esc((t.title||'(제목 없음)').slice(0,10))+'</button>').join('')}
function bind(){document.querySelectorAll('[data-k]').forEach(e=>{const v=s[e.dataset.k];if(e.type=='checkbox')e.checked=!!v;else e.value=v});$('#tpvbg').value=s.pvbg;bindT()}
function drawIm(){const T=s.topics[s.cur],card=s.lay=='card';$('#timgs').innerHTML=Object.keys(IM).map(n=>{const on=T.imgs.includes(n);return '<div class="t-im"><img src="'+IM[n]+'" alt=""><b>'+n+'</b><em>'+Math.round(IM[n].length*.75/1024)+'KB</em>'+(card?['a','b'].map(k=>{const u=T[k+'i']==n;return '<button class="t-b'+(u?' on':'')+'" type="button" data-as="'+k+'|'+n+'">'+k.toUpperCase()+(u?' 쓰는 중':' 쓰기')+'</button>'}).join(''):'<button class="t-b'+(on?' on':'')+'" type="button" data-use="'+n+'">'+(on?'쓰는 중':'쓰기')+'</button>')+'<button class="t-b" type="button" data-del="'+n+'">삭제</button></div>'}).join('')}
function saveIm(){try{localStorage.setItem('pairmkim',JSON.stringify(IM))}catch(e){toast('이 환경에서는 이미지 자동 저장이 안 돼요 (이번 접속 동안만 유지돼요)')}}
const load=(f,m)=>new Promise(res=>{const r=new FileReader();r.onerror=()=>res('');r.onload=()=>{const im=new Image();im.onerror=()=>res('');im.onload=()=>{const cw=Math.min(im.width,m),ch=Math.round(im.height*cw/im.width),c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);res(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset||{};
 if(d.k){s[d.k]=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;render()}
 else if(d.t){s.topics[s.cur][d.t]=t.value;render()}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.p){Object.assign(s,PRE[d.p]);bind();render()}
 else if(d.tp!==undefined){s.cur=+d.tp;bindT();render()}
 else if(d.add){s.topics.push(blank());s.cur=s.topics.length-1;bindT();render()}
 else if(d.mv){const j=s.cur+(+d.mv);if(j<0||j>=s.topics.length)return;const a=s.topics;[a[s.cur],a[j]]=[a[j],a[s.cur]];s.cur=j;render()}
 else if(d.rmt){if(s.topics.length<2){toast('페어는 최소 1개가 필요해요');return}if(confirm('이 페어를 삭제할까요?')){s.topics.splice(s.cur,1);s.cur=Math.min(s.cur,s.topics.length-1);bindT();render()}}
 else if(d.use){const a=s.topics[s.cur].imgs,i=a.indexOf(d.use);if(i<0)a.push(d.use);else a.splice(i,1);render()}
 else if(d.as){const[k,n]=d.as.split('|'),T=s.topics[s.cur],y=k+'i';T[y]=T[y]==n?'':n;render()}
 else if(d.del){delete IM[d.del];s.topics.forEach(x=>{x.imgs=x.imgs.filter(n=>n!=d.del);if(x.ai==d.del)x.ai='';if(x.bi==d.del)x.bi=''});saveIm();render()}
 else if(d.w){$('#tpvw').style.maxWidth=d.w}});
$('#tup').onclick=()=>$('#tfile').click();
$('#tfile').onchange=async e=>{const fs=[...e.target.files];e.target.value='';
 for(const f of fs){const u=await load(f,parseInt(s.imgw)||800);if(!u)continue;let n=1;while(IM['사진'+n])n++;IM['사진'+n]=u;saveIm();const T=s.topics[s.cur];if(s.lay=='card'){if(!T.ai)T.ai='사진'+n;else if(!T.bi)T.bi='사진'+n}else T.imgs.push('사진'+n)}
 render();toast('올리고 이 페어에 넣었어요')};
$('#tpvbg').onchange=e=>{s.pvbg=e.target.value;render()};
function toast(m){const t=$('#ttoast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
async function copy(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok)}catch(e){const o=$('#tout'),old=o.value;o.value=txt;o.select();try{document.execCommand('copy');toast(ok)}catch(x){toast('코드를 직접 복사해 주세요')}o.value=old}}
$('#tcopy').onclick=()=>copy(build(),'전체 코드를 복사했어요');
$('#tcopy1').onclick=()=>copy(build(s.cur),'이 페어만 복사했어요');
$('#treset').onclick=()=>{if(confirm('설정과 모든 페어를 처음 상태로 되돌릴까요? (올린 이미지는 남아요)')){s=JSON.parse(JSON.stringify(D));bind();render()}};
$('#ttheme').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark'?'light':'dark'};
bind();render();
</script>
