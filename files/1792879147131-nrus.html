<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOG MAKER 2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#dfe9f5;--cd:#f4f8fd;--ln:#9db6d6;--tx:#2b3a4d;--sb:#6c7f97;--a:#2f6fc4;--in:#fff;--hd:#eaf2fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b26;--cd:#1d2635;--ln:#3a4f6d;--tx:#dbe5f2;--sb:#8fa3bd;--a:#7db3f5;--in:#141b26;--hd:#223049}}
:root[data-theme="dark"]{--bg:#141b26;--cd:#1d2635;--ln:#3a4f6d;--tx:#dbe5f2;--sb:#8fa3bd;--a:#7db3f5;--in:#141b26;--hd:#223049}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.t-wrap{max-width:1100px;margin:0 auto;padding:12px}
.t-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#5b9be0,#2f6fc4);color:#fff;border-radius:8px 8px 0 0}
.t-top b{font-size:14px}.t-top span{font-size:11px;opacity:.85;flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
.t-b{padding:4px 10px;background:var(--hd);border:1px solid var(--ln);border-radius:3px;cursor:pointer}
.t-b:hover{border-color:var(--a);color:var(--a)}
.t-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:12px;margin-top:12px}
@media(max-width:820px){.t-grid{grid-template-columns:1fr}}
.t-box{background:var(--cd);border:1px solid var(--ln);border-radius:4px;margin-bottom:10px}
.t-box>summary,.t-ttl{padding:8px 12px;font-weight:bold;color:var(--a);cursor:pointer;list-style:none;border-bottom:1px solid var(--ln);background:var(--hd)}
.t-ttl{cursor:default;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.t-ttl .sp{flex:1}
.t-in{padding:10px 12px;display:grid;gap:8px}
.t-f{display:grid;gap:3px}.t-f>span{font-size:11px;color:var(--sb)}
.t-f input:not([type=range]):not([type=color]),.t-f select,textarea{width:100%;padding:6px 8px;background:var(--in);border:1px solid var(--ln);border-radius:3px}
.t-f input[type=color]{width:100%;height:28px;padding:0;border:1px solid var(--ln);background:none}
textarea{resize:vertical;line-height:1.6}
.t-c{display:flex;gap:6px;align-items:center}
.t-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t-tb{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.t-pr{display:flex;gap:6px;flex-wrap:wrap}
.t-pr button{display:flex;align-items:center;gap:5px}.t-pr i{width:10px;height:10px;border-radius:50%;display:inline-block}
.t-help{font-size:11px;color:var(--sb);line-height:1.7}
.t-im{display:flex;align-items:center;gap:6px;margin-top:4px}.t-im img,.t-im s{width:36px;height:36px;object-fit:cover;border:1px solid var(--ln);border-radius:3px;display:inline-block}.t-im b{flex:1}.t-im em{font-size:11px;color:var(--sb);font-style:normal}
#tpvw{padding:18px 14px;margin:0 auto;overflow-x:auto;transition:max-width .2s}
#tout{width:100%;height:220px;font:11px/1.5 monospace;white-space:pre}
.t-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--a);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.t-toast.on{opacity:1}
</style>
</head>
<body>
<div class="t-wrap">
  <div class="t-top"><b>LOG MAKER 2</b><span>배경 투명 · 말풍선 + 이미지만 (대화 로그 백업)</span><button class="t-b" id="ttheme" type="button">화면 밝기</button></div>
  <div class="t-grid">
    <div id="tctl"></div>
    <div>
      <div class="t-box">
        <div class="t-ttl">미리보기<span class="sp"></span>
          <button class="t-b" type="button" data-w="100%">PC</button>
          <button class="t-b" type="button" data-w="360px">모바일</button>
          <select id="tpvbg" class="t-b"><option value="#ffffff">흰 배경</option><option value="#f1f3f5">회색 배경</option><option value="#f6efe0">베이지 배경</option><option value="#1a1a1a">어두운 배경</option></select>
        </div>
        <div id="tpvbox"><div id="tpvw"><div id="tpv"></div></div></div>
      </div>
      <div class="t-box">
        <div class="t-ttl">게시판에 붙여넣을 코드 <span id="tsize" class="t-help"></span><span class="sp"></span>
          <button class="t-b" type="button" id="tcopy">코드 복사</button>
          <button class="t-b" type="button" id="treset">초기화</button>
        </div>
        <div class="t-in"><textarea id="tout" readonly></textarea>
        <div class="t-help">글 편집창을 HTML 모드로 바꾼 뒤 통째로 붙여넣으세요. 배경은 투명이라 게시판 배경이 그대로 보여요. 설정과 올린 사진은 이 브라우저에 자동 저장돼요.</div></div>
      </div>
    </div>
  </div>
</div>
<div class="t-toast" id="ttoast"></div>
<script>
const $=q=>document.querySelector(q);
const LINK='<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">';
const FONTS={pre:'"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',noto:'"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',sys:'"Malgun Gothic","Apple SD Gothic Neo",sans-serif',ser:'"Nanum Myeongjo","Noto Serif KR","Batang",serif'};
/* ac=기본 프로필 배경, bl/br=상대/내 말풍선, tx=말풍선 글자, ln=테두리, ot=이름·시간, nt=가운데 글 */
const PRE={
nate:{ac:'#2f6fc4',bl:'#ffffff',br:'#d6e8fb',tx:'#2b3a4d',ot:'#6c7f97',nt:'#2b3a4d',ln:'#9db6d6',avatar:'sq',bubble:'tail'},
pink:{ac:'#d9568a',bl:'#ffffff',br:'#ffd6e5',tx:'#4a2b38',ot:'#a07084',nt:'#4a2b38',ln:'#f0b5cb',avatar:'round',bubble:'round'},
mint:{ac:'#2a9d8f',bl:'#ffffff',br:'#c9efe8',tx:'#23423e',ot:'#6b928d',nt:'#23423e',ln:'#a6d9d0',avatar:'round',bubble:'round'},
lav:{ac:'#7a5fc7',bl:'#ffffff',br:'#e3d9fb',tx:'#352b52',ot:'#8a7fa8',nt:'#352b52',ln:'#cfc2f0',avatar:'round',bubble:'tail'},
dark:{ac:'#3a6aa8',bl:'#2a3040',br:'#3b5b8f',tx:'#e6ecf5',ot:'#9aa6bd',nt:'#e6ecf5',ln:'#3a4256',avatar:'round',bubble:'round'},
paper:{ac:'#8b5e34',bl:'#fffaf0',br:'#ecdcb8',tx:'#3d3022',ot:'#8f7d63',nt:'#3d3022',ln:'#d0bd96',avatar:'sq',bubble:'square'},
mono:{ac:'#333333',bl:'#ffffff',br:'#f0f0f0',tx:'#222222',ot:'#888888',nt:'#222222',ln:'#cccccc',avatar:'round',bubble:'square'}};
const PN={nate:'네이트온',pink:'핑크',mint:'민트',lav:'라벤더',dark:'다크',paper:'종이',mono:'미니멀'};
const D=Object.assign({id:'lgb',showName:true,showTime:true,group:true,avR:true,avb:false,width:460,fs:13,font:'pre',link:false,imgL:'',imgR:'',nameL:'상대',nameR:'나',pvbg:'#ffffff',imgw:'800',
body:'> 비 오는 저녁, 카페 창가 자리.\nA: 안녕! 오늘 뭐 했어? ;;오후 3:20\nB: 그냥 집에 있었어 ㅎㅎ ;;오후 3:21\nB: 너는?\n> 상대가 창밖을 바라보며 웃는다.\nA: *산책 다녀왔어*\n+ 날씨 진짜 좋더라 ;;오후 3:22\nB: **부럽다** 나도 갈걸'},PRE.nate);
let s={...D},IM={};
try{Object.assign(s,JSON.parse(localStorage.getItem('bblog2')||'{}'))}catch(e){}
try{IM=JSON.parse(localStorage.getItem('bblogim')||'{}')}catch(e){}

const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const il=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\*(.+?)\*/g,'<em>$1</em>')
 .replace(/\[이미지 (\S+?)\]/g,(a,n)=>IM[n]?'<img class="l-img" src="'+IM[n]+'" alt="">':'').replace(/\n/g,'<br>');
const DEF='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4" fill="#fff"/><path d="M4 22c0-4.5 3.6-7 8-7s8 2.5 8 7z" fill="#fff"/></svg>';

function parse(src){const out=[];let last=null;
 const sp=l=>{let m=l.match(/^([AaBb])\s*[:：]\s*(.*)$/);if(m)return[m[1].toUpperCase(),m[2]];
  for(const[k,n]of[['A',s.nameL],['B',s.nameR]])if(n&&l.startsWith(n+':'))return[k,l.slice(n.length+1).trim()];return null};
 for(const L of src.split('\n')){const l=L.trim();if(!l)continue;let m,p;
  if(m=l.match(/^>\s*(.*)$/)){last={t:'n',x:m[1]};out.push(last)}
  else if(p=sp(l)){last={t:'m',s:p[0],x:p[1]};out.push(last)}
  else if(last)last.x+='\n'+(l[0]=='+'?l.slice(1).trim():l)}
 return out}

function gen(){
 const P=(s.id||'').replace(/[^\w-]/g,'')||'lgb',br=({tail:6,round:16,square:2})[s.bubble],ar=s.avatar=='round'?'50%':'4px',hasAv=s.avatar!='none';
 const css=`§{--ac:${s.ac};--ln:${s.ln};--bl:${s.bl};--br:${s.br};--tx:${s.tx};--ot:${s.ot};--nt:${s.nt};all:initial;display:block;box-sizing:border-box;width:100%;max-width:${s.width}px;margin:0 auto;font-family:${FONTS[s.font]};font-size:${s.fs}px;line-height:1.5;color:var(--tx)}
§ *{box-sizing:border-box;font-family:inherit}
§ .l-bd{display:block;padding:4px 0}
§ .l-n{margin:14px 0;text-align:center;color:var(--nt);line-height:1.7;word-break:break-word}
§ .l-r{display:flex;align-items:flex-start;gap:8px;margin-bottom:3px}
§ .l-r.l-f{margin-top:10px}
§ .l-R{flex-direction:row-reverse}
§ .l-av{width:40px;height:40px;flex:none;overflow:hidden;border-radius:${ar}${s.avb?';border:1px solid var(--ln)':''}}
§ .l-av img,§ .l-av svg{display:block;width:100%;height:100%;object-fit:cover}
§ .l-av svg{background:var(--ac)}
§ .l-sp{width:40px;flex:none}
§ .l-c{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:${hasAv?'calc(100% - 100px)':'85%'}}
§ .l-R .l-c{align-items:flex-end}
§ .l-nm{font-size:11px;font-weight:bold;color:var(--ot);margin:0 2px 3px}
§ .l-m{display:flex;align-items:flex-end;gap:5px;max-width:100%}
§ .l-R .l-m{flex-direction:row-reverse}
§ .l-bb{position:relative;min-width:0;padding:8px 11px;border:1px solid var(--ln);border-radius:${br}px;line-height:1.6;word-break:break-word;color:var(--tx)}
§ .l-L .l-bb{background:var(--bl)}
§ .l-R .l-bb{background:var(--br)}
§ .l-tm{font-size:10px;color:var(--ot);white-space:nowrap;flex:none}
§ .l-img{display:block;max-width:100%;height:auto;border-radius:4px;margin:2px 0}
§ b{font-weight:bold}
§ em{font-style:italic;opacity:.8}
§ s{color:inherit}
§ mark{background:rgba(255,214,102,.5);color:inherit;padding:1px 3px;border-radius:2px}${s.bubble=='tail'?`
§ .l-f .l-bb::before{content:"";position:absolute;top:11px;width:8px;height:8px;border:1px solid var(--ln);transform:rotate(45deg)}
§ .l-L.l-f .l-bb::before{left:-5px;background:var(--bl);border-width:0 0 1px 1px}
§ .l-R.l-f .l-bb::before{right:-5px;background:var(--br);border-width:1px 1px 0 0}`:''}`.replace(/§/g,'#'+P);
 const av=k=>{const u=k=='A'?s.imgL:s.imgR;return u?'<img src="'+u+'" alt="">':DEF};
 let h='<div id="'+P+'"><div class="l-bd">',prev=null;
 for(const it of parse(s.body)){
  if(it.t=='n'){h+='<div class="l-n">'+il(it.x)+'</div>';prev=null;continue}
  const A=it.s=='A',first=!(s.group&&prev&&prev.s==it.s);prev=it;
  let x=it.x,tm='';const i=x.lastIndexOf(';;');if(i>=0){tm=x.slice(i+2).trim();x=x.slice(0,i).trim()}
  const showAv=hasAv&&(A||s.avR);
  h+='<div class="l-r '+(A?'l-L':'l-R')+(first?' l-f':'')+'">'+(showAv?(first?'<div class="l-av">'+av(it.s)+'</div>':'<div class="l-sp"></div>'):'')
   +'<div class="l-c">'+(first&&s.showName?'<div class="l-nm">'+esc(A?s.nameL:s.nameR)+'</div>':'')+'<div class="l-m"><div class="l-bb">'+il(x)+'</div>'+(s.showTime&&tm?'<span class="l-tm">'+esc(tm)+'</span>':'')+'</div></div></div>'}
 return{css,html:h+'</div></div>'}}

function render(){const{css,html}=gen(),n=(s.link?LINK+'\n':'')+'<style>\n'+css+'\n</style>\n\n'+html;
 $('#tout').value=n;$('#tpv').innerHTML='<style>'+css+'</style>'+html;$('#tpvbox').style.background=s.pvbg;
 $('#tsize').textContent=n.length+'자'+(n.length>300000?' ⚠ 너무 길어서 게시판이 못 받을 수 있어요. 사진을 줄여 보세요':'');
 document.querySelectorAll('[data-v]').forEach(e=>e.textContent=s[e.dataset.v]);
 try{localStorage.setItem('bblog2',JSON.stringify(s))}catch(e){toast('프로필 사진이 커서 저장은 못 했어요')}}

const inp=(k,l)=>'<label class="t-f"><span>'+l+'</span><input data-k="'+k+'"></label>';
const chk=(k,l)=>'<label class="t-c"><input type="checkbox" data-k="'+k+'"> '+l+'</label>';
const col=(k,l)=>'<label class="t-f"><span>'+l+'</span><input type="color" data-k="'+k+'"></label>';
const rng=(k,l,a,b)=>'<label class="t-f"><span>'+l+' <em data-v="'+k+'"></em></span><input type="range" min="'+a+'" max="'+b+'" data-k="'+k+'"></label>';
const sel=(k,l,o)=>'<label class="t-f"><span>'+l+'</span><select data-k="'+k+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></label>';
const sec=(t,c,o)=>'<details class="t-box"'+(o?' open':'')+'><summary>'+t+'</summary><div class="t-in">'+c+'</div></details>';
$('#tctl').innerHTML=
 sec('1. 디자인 고르기','<div class="t-pr">'+Object.keys(PRE).map(k=>'<button class="t-b" type="button" data-p="'+k+'"><i style="background:'+PRE[k].ac+'"></i>'+PN[k]+'</button>').join('')+'</div>'
  +'<div class="t-help">먼저 마음에 드는 디자인을 누르고, 아래 칸에서 색이나 모양을 바꿔 보세요. 배경은 항상 투명이에요.</div>'
  +'<div class="t-g2">'+sel('bubble','말풍선 모양',[['tail','꼬리 있는 네모'],['round','둥근'],['square','각진']])+sel('avatar','프로필 모양',[['sq','네모'],['round','동그라미'],['none','없음']])+'</div>'
  +'<div class="t-g2">'+col('bl','상대 말풍선')+col('br','내 말풍선')+col('tx','말풍선 글자색')+col('ln','테두리색')+col('ot','이름 · 시간 글자색')+col('nt','가운데 글 색')+col('ac','기본 프로필색')+'</div>'
  +rng('width','가로 폭(px)',300,700)+rng('fs','글자 크기(px)',11,18)+sel('font','글꼴',[['pre','프리텐다드'],['noto','Noto Sans KR'],['sys','시스템 기본'],['ser','명조']]),1)
 +sec('2. 이름 · 프로필 사진','<div class="t-g2">'+inp('nameL','상대 이름 (왼쪽)')+inp('nameR','내 이름 (오른쪽)')+'</div>'
  +'<div id="tpf"></div><input type="file" id="tfp" accept="image/*" hidden>'
  +chk('showName','이름 보이기')+chk('showTime','시간 보이기')+chk('group','같은 사람이 이어 말하면 이름 · 프로필 한 번만')+chk('avR','내 프로필도 보이기')+chk('avb','프로필 테두리 (말풍선 테두리색)'),1)
 +sec('3. 대화 내용','<div class="t-tb"><button class="t-b" type="button" data-m="\nA: |">상대 A:</button><button class="t-b" type="button" data-m="\nB: |">나 B:</button><button class="t-b" type="button" data-m="\n> |">가운데 글 &gt;</button><button class="t-b" type="button" data-m="\n+ |">줄바꿈 +</button><button class="t-b" type="button" data-m=" ;;오후 3:20|">시간</button><button class="t-b" type="button" data-m="**|**"><b>B</b></button><button class="t-b" type="button" data-m="*|*"><i>행동</i></button><button class="t-b" type="button" data-m="==|==">형광펜</button></div>'
  +'<textarea id="tbody" rows="14" data-k="body"></textarea>'
  +'<div class="t-tb"><button class="t-b" type="button" id="tup">대화에 넣을 이미지 올리기</button><input type="file" id="tfile" accept="image/*" multiple hidden><select data-k="imgw"><option value="500">최대 가로 500px</option><option value="800">최대 가로 800px</option><option value="1000">최대 가로 1000px</option></select></div><div id="timgs"></div>'
  +'<div class="t-help">A: 상대(왼쪽) / B: 나(오른쪽) 로 시작하는 줄이 말풍선이 돼요. 상대이름: 내용 으로 써도 돼요.<br><b>&gt; 로 시작하는 줄은 말풍선 없이 글씨만 가운데에</b> 나와요 (예: &gt; 비 오는 저녁)<br>줄 맨 앞 + 는 앞 줄 안에서 줄바꿈 / 줄 끝 ;;시간 은 말풍선 옆 시간<br>**굵게** *행동 묘사* ==형광펜== ~~취소선~~ / 이미지는 [이미지 사진1] 처럼 들어가요 (가운데 글 안에도 가능)<br>표시 없는 줄은 앞 줄에 이어 붙어요</div>',1)
 +sec('4. 출력 옵션',inp('id','고유 ID (한 글에 여러 개 넣을 땐 서로 다르게)')+chk('link','프리텐다드 불러오는 줄을 코드 맨 위에 포함'));

function bind(){document.querySelectorAll('[data-k]').forEach(e=>{const v=s[e.dataset.k];if(e.type=='checkbox')e.checked=!!v;else e.value=v});$('#tpvbg').value=s.pvbg;drawPf();drawIm()}
function drawPf(){$('#tpf').innerHTML=[['L','상대'],['R','나']].map(a=>'<div class="t-im">'+(s['img'+a[0]]?'<img src="'+s['img'+a[0]]+'" alt="">':'<s></s>')+'<b>'+a[1]+' 프로필</b><button class="t-b" type="button" data-up="'+a[0]+'">올리기</button><button class="t-b" type="button" data-rm="'+a[0]+'">지우기</button></div>').join('')}
function drawIm(){const k=Object.keys(IM);$('#timgs').innerHTML=k.map(n=>'<div class="t-im"><img src="'+IM[n]+'" alt=""><b>'+n+'</b><em>'+Math.round(IM[n].length*.75/1024)+'KB</em><button class="t-b" type="button" data-ins="'+n+'">넣기</button><button class="t-b" type="button" data-del="'+n+'">삭제</button></div>').join('')}
function saveIm(){try{localStorage.setItem('bblogim',JSON.stringify(IM))}catch(e){toast('이미지가 커서 저장은 못 했어요 (이번 접속 동안만 유지돼요)')}}
const load=(f,m,sq)=>new Promise(res=>{const r=new FileReader();r.onerror=()=>res('');r.onload=()=>{const im=new Image();im.onerror=()=>res('');im.onload=()=>{let w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h,cw,ch;if(sq){const k=Math.min(w,h);sx=(w-k)/2;sy=(h-k)/2;sw=sh=k;cw=ch=m}else{cw=Math.min(w,m);ch=Math.round(h*cw/w)}const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);res(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)});
let side='L';
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;s[k]=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;render()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.p){Object.assign(s,PRE[d.p]);bind();render()}
 else if(d.up){side=d.up;$('#tfp').click()}
 else if(d.rm){s['img'+d.rm]='';drawPf();render()}
 else if(d.ins){wrap('\n[이미지 '+d.ins+']\n','')}
 else if(d.del){delete IM[d.del];saveIm();drawIm();render()}
 else if(d.w){$('#tpvw').style.maxWidth=d.w}
 else if(d.m!==undefined){const i=d.m.lastIndexOf('|');wrap(d.m.slice(0,i),d.m.slice(i+1))}});
$('#tfp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;s['img'+side]=await load(f,96,true);drawPf();render()};
$('#tup').onclick=()=>$('#tfile').click();
$('#tfile').onchange=async e=>{const fs=[...e.target.files];e.target.value='';
 for(const f of fs){const u=await load(f,parseInt(s.imgw)||800,false);if(!u)continue;let n=1;while(IM['사진'+n])n++;IM['사진'+n]=u;saveIm();drawIm();wrap('\n[이미지 사진'+n+']\n','')}
 toast('올리고 대화에도 넣었어요')};
$('#tpvbg').onchange=e=>{s.pvbg=e.target.value;render()};
function wrap(l,r){const t=$('#tbody'),a=t.selectionStart,b=t.selectionEnd,v=t.value;t.value=v.slice(0,a)+l+v.slice(a,b)+r+v.slice(b);t.focus();t.selectionStart=a+l.length;t.selectionEnd=b+l.length;t.dispatchEvent(new Event('input',{bubbles:true}))}
function toast(m){const t=$('#ttoast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
$('#tcopy').onclick=async()=>{const o=$('#tout');try{await navigator.clipboard.writeText(o.value);toast('복사했어요')}catch(e){o.select();try{document.execCommand('copy');toast('복사했어요')}catch(x){toast('코드를 직접 복사해 주세요')}}};
$('#treset').onclick=()=>{if(confirm('설정과 대화 내용을 처음 상태로 되돌릴까요? (올린 이미지는 남아요)')){s={...D};bind();render()}};
$('#ttheme').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark'?'light':'dark'};
bind();render();
</script>
</body>
</html>
