const pad=n=>String(n).padStart(2,'0'),d0=new Date();

body:'**성인 여성**\n**Caveduck kit 님** 캐릭터 위주 플레이\n다양한 플랫폼에서 찍먹 多\n\n[접기 성향]\n==1T1D 극온리 성향==으로 동일한 배려 요구합니다\n==탐라 유입 및 직멘 배려, 정실 찍먹 안 하기== 필수라 어려우신 분들은 흔적 X\n==Caveduck 임찬희, teapot 7== 배려 필요 나머지는 배려 불필요\n블락이 아닌 경우 ==재연결 OK==\n블락의 경우 어떠한 경우에도 ==컨택 X==\n[/접기]\n\n[접기 NG]\n미성년자\n드림 지우기\n겹드림 서치 후 기능(블락, 뮤트) 사용하고 있으며 악의는 없습니다\n허공저격, 발콕콕, 잦은 공론화 및 이슈 말 얹기 심하신 분\n남들이 불편할 수 있는 비윤리적 소재 신경 쓰지 않으며 관련 건으로 찍먹 합니다\n[/접기]'};

  else if(!l)fl();else b.push(il(l))}
 fl();if(f)o+='</div></details>';return o}

function gen(){
 const P=(s.id||'').replace(/[^\w-]/g,'')||'ntc',a=s.color,t1=mix(a,.3),ln=mix(a,.6),hd=mix(a,.92),wn=mix(a,.96),bt=mix(a,.88),hl=mix(a,.85);
 const ic=n=>s.icon=='none'?'':'<svg width="'+n+'" height="'+n+'" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[s.icon]+'</svg>';
 const css=`§{--a:${a};--t1:${t1};--ln:${ln};--hd:${hd};--wn:${wn};--bt:${bt};--tx:#2b3a4d;--sb:#6c7f97;--cd:#fff;all:initial;display:block;box-sizing:border-box;width:100%;max-width:${s.width}px;margin:0 auto;font-family:${FONTS[s.font]};font-size:13px;line-height:1.4;color:var(--tx)}

 return{css,html}}

function render(){const{css,html}=gen();
 $('#tout').value=(s.link?LINK+'\n':'')+'<style>\n'+css+'\n</style>\n\n'+html;
 $('#tpv').innerHTML='<style>'+css+'</style>'+html.replace(/<img src="(https?:[^"]*)" alt="" loading="lazy">/g,'<div style="padding:22px 8px;text-align:center;border:1px dashed var(--ln);color:var(--sb);font-size:11px;word-break:break-all;border-radius:4px;line-height:1.5">이미지 자리 (미리보기에선 안 보여요)<br>$1</div>');
 $('#tpvbox').style.background=s.pvbg;$('#tsize').textContent=$('#tout').value.length+'자'+($('#tout').value.length>300000?' ⚠ 너무 길어서 게시판이 못 받을 수 있어요. 이미지 크기를 줄여 보세요':'');
 document.querySelectorAll('[data-v]').forEach(e=>e.textContent=s[e.dataset.v]);
 try{localStorage.setItem('ntgen',JSON.stringify(s))}catch(e){}}

const inp=(k,l)=>'<label class="t-f"><span>'+l+'</span><input data-k="'+k+'"></label>';
const chk=(k,l)=>'<label class="t-c"><input type="checkbox" data-k="'+k+'"> '+l+'</label>';
const rng=(k,l,a,b)=>'<label class="t-f"><span>'+l+' <em data-v="'+k+'"></em></span><input type="range" min="'+a+'" max="'+b+'" data-k="'+k+'"></label>';
const sel=(k,l,o)=>'<label class="t-f"><span>'+l+'</span><select data-k="'+k+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></label>';
const SW=['#2f6fc4','#d9568a','#2a9d8f','#7a5fc7','#e07b39','#55657a','#222222'];
const sec=(t,c,o)=>'<details class="t-box"'+(o?' open':'')+'><summary>'+t+'</summary><div class="t-in">'+c+'</div></details>';
$('#tctl').innerHTML=
 sec('글 내용',inp('title','글 제목')+inp('author','작성자')+inp('date','날짜')+inp('views','조회수')+inp('tag','말머리 (공지 등)')
  +'<div class="t-f"><span>본문</span><div class="t-tb"><button class="t-b" type="button" data-m="**|**"><b>B</b></button><button class="t-b" type="button" data-m="==|==">형광펜</button><button class="t-b" type="button" data-m="~~|~~"><s>S</s></button><button class="t-b" type="button" data-m="__|__"><u>U</u></button><button class="t-b" type="button" data-m="[접기 제목]\n|\n[/접기]">접기</button><button class="t-b" type="button" data-m="\n---\n|">구분선</button><button class="t-b" type="button" data-m="> |">인용</button><button class="t-b" type="button" data-m="[이미지 https://이미지주소 | https://이동할주소]|">이미지</button><input type="color" id="ttc" value="#e0245e" title="글자색" style="width:30px;height:26px;padding:0;border:0;background:none"></div>'
  +'<textarea id="tbody" rows="14" data-k="body"></textarea>'
  +'<div class="t-tb"><button class="t-b" type="button" id="tup">이미지 파일 올리기</button><input type="file" id="tfile" accept="image/*" multiple hidden><select data-k="imgw"><option value="600">최대 가로 600px</option><option value="800">최대 가로 800px</option><option value="1000">최대 가로 1000px</option></select></div><div id="timgs"></div></div>'
  +'<div class="t-help">**굵게** ==형광펜== ~~취소선~~ __밑줄__ {#e0245e|색깔글씨}<br>[접기 제목] ... [/접기] 로 접기 칸, [펼침 제목]은 처음부터 열림<br>--- 구분선 / 줄 맨 앞 > 인용 / 주소는 자동 링크 / 빈 줄은 문단 나눔<br>[이미지 이미지주소 | 눌렀을 때 이동할 주소] 한 줄로 쓰면 클릭되는 이미지 (뒤쪽 주소는 생략 가능, 주소는 https://로 시작)<br>파일은 위의 이미지 파일 올리기로 올리면 [이미지 사진1] 으로 본문에 들어가요. 링크는 올린 사진 아래 칸에 주소만 적으면 걸려요 (본문에 직접 쓰려면 [이미지 사진1 | https://이동할주소]). 올린 사진은 JPG로 줄여서 코드 안에 직접 담겨요 (GIF는 멈춘 그림이 돼요)</div>',1)
 +sec('창 제목 · 헤더 문구',inp('winTitle','창 제목줄 (맨 위 파란 줄 글자)')+inp('headTitle','헤더 제목 (큰 파란 글자)')+inp('headSub','헤더 설명 (작은 회색 글자)')+inp('footLabel','체크박스 문구')+inp('footBtn','버튼 문구'),1)
 +sec('색 · 모양',sel('icon','아이콘',[['mega','확성기'],['bell','종'],['heart','하트'],['star','별'],['info','느낌표'],['mail','편지'],['chat','말풍선'],['note','메모'],['book','책'],['moon','달'],['flower','꽃'],['crown','왕관'],['bolt','번개'],['lock','자물쇠'],['check','체크'],['warn','경고'],['flag','깃발'],['music','음표'],['cat','고양이'],['gift','선물'],['clock','시계'],['diamond','다이아'],['shield','방패'],['leaf','나뭇잎'],['cloud','구름'],['none','없음']])
  +'<div class="t-f"><span>테마 색</span><div class="t-sw">'+SW.map(c=>'<button type="button" data-c="'+c+'" style="background:'+c+'"></button>').join('')+'<input type="color" data-k="color" title="직접 고르기"></div></div>'
  +rng('width','가로 폭(px)',300,700)+rng('radius','모서리 둥글기',0,20)+sel('font','글꼴',[['pre','프리텐다드'],['noto','Noto Sans KR'],['sys','시스템 기본'],['ser','명조']])+chk('shadow','그림자'))
 +sec('보이기 · 숨기기',chk('showBar','제목줄')+chk('showBtns','제목줄 _ □ ✕ 버튼')+chk('showHead','헤더 영역')+chk('showTag','말머리')+chk('showFoot','하단 체크박스 · 확인 버튼'))
 +sec('출력 옵션',inp('id','고유 ID (한 글에 여러 개 넣을 땐 서로 다르게)')+chk('link','프리텐다드 불러오는 줄을 코드 맨 위에 포함'));

function bind(){document.querySelectorAll('[data-k]').forEach(e=>{const v=s[e.dataset.k];if(e.type=='checkbox')e.checked=!!v;else e.value=v})
 $('#tpvbg').value=s.pvbg}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const t=e.target;s[k]=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;render()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.c){s.color=t.dataset.c;bind();render()}
 else if(t.dataset.ins){wrap('[이미지 '+t.dataset.ins+']\n','')}
 else if(t.dataset.del){delete IM[t.dataset.del];delete LK[t.dataset.del];saveIm();saveLk();drawIm();render()}
 else if(t.dataset.w){$('#tpvw').style.maxWidth=t.dataset.w}
 else if(t.dataset.m!==undefined){const m=t.dataset.m,i=m.lastIndexOf('|');wrap(m.slice(0,i),m.slice(i+1))}});
$('#tpvbg').onchange=e=>{s.pvbg=e.target.value;render()};
$('#ttc').onchange=e=>wrap('{'+e.target.value+'|','}');
function wrap(l,r){const t=$('#tbody'),a=t.selectionStart,b=t.selectionEnd,v=t.value;t.value=v.slice(0,a)+l+v.slice(a,b)+r+v.slice(b);t.focus();t.selectionStart=a+l.length;t.selectionEnd=b+l.length;t.dispatchEvent(new Event('input',{bubbles:true}))}
function toast(m){const t=$('#ttoast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}
$('#tcopy').onclick=async()=>{const o=$('#tout');try{await navigator.clipboard.writeText(o.value);toast('복사했어요')}catch(e){o.select();try{document.execCommand('copy');toast('복사했어요')}catch(x){toast('코드를 길게 눌러 직접 복사해 주세요')}}};
$('#treset').onclick=()=>{if(confirm('모든 내용을 처음 상태로 되돌릴까요?')){s={...D};bind();render()}};
$('#ttheme').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark'?'light':'dark'};
function saveLk(){try{localStorage.setItem('ntlk',JSON.stringify(LK))}catch(e){}}
function saveIm(){try{localStorage.setItem('ntimgs',JSON.stringify(IM))}catch(e){toast('이미지가 커서 저장은 못 했어요 (이번 접속 동안만 유지돼요)')}}
function drawIm(){const k=Object.keys(IM);$('#timgs').innerHTML=k.length?k.map(n=>'<div><div class="t-im"><img src="'+IM[n]+'" alt=""><b>'+n+'</b><em>'+Math.round(IM[n].length*.75/1024)+'KB</em><button class="t-b" type="button" data-ins="'+n+'">넣기</button><button class="t-b" type="button" data-del="'+n+'">삭제</button></div><input class="t-lk" data-lk="'+n+'" value="'+(LK[n]||'').replace(/"/g,'&quot;')+'" placeholder="눌렀을 때 이동할 주소 (https://...)"></div>').join(''):'<div class="t-help">올린 이미지가 여기에 보여요</div>'}
document.addEventListener('input',e=>{const n=e.target.dataset&&e.target.dataset.lk;if(!n)return;LK[n]=e.target.value.trim();saveLk();render()});
$('#tup').onclick=()=>$('#tfile').click();
$('#tfile').onchange=async e=>{const fs=[...e.target.files];e.target.value='';
 for(const f of fs){await new Promise(res=>{const r=new FileReader();r.onerror=res;r.onload=()=>{const im=new Image();im.onerror=res;im.onload=()=>{let w=im.width,h=im.height;const m=parseInt(s.imgw)||800;if(w>m){h=Math.round(h*m/w);w=m}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let n=1;while(IM['사진'+n])n++;IM['사진'+n]=c.toDataURL('image/jpeg',.82);saveIm();drawIm();wrap('\n[이미지 사진'+n+']\n','');res()};im.src=r.result};r.readAsDataURL(f)})}
 toast('올렸어요! 목록의 사진 아래 칸에 링크 주소를 적을 수 있어요')};
drawIm();bind();render();
</script>
</body>
</html>
